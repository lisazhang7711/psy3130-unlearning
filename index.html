<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>领导力的另一面｜PSY3130 论证流</title>
<meta name="description" content="PSY3130 Psychology of Leadership：五个领导力误解，各自的辩白，辩白的边界，以及换一种问法。中英双语，可自动推演的论证流导图。">
<link rel="stylesheet" href="assets/logic.css?v=2">
</head>
<body>

<header class="hero">
  <div class="wrap">
    <p class="kicker" id="kicker"></p>
    <h1 id="h1"></h1>
    <p class="sub" id="sub"></p>
    <p class="lede" id="lede"></p>
  </div>
</header>

<main>

  <div class="toolbar">
    <div class="wrap toolbar-inner">
      <div class="tgroup" id="langBtns"></div>
      <div class="tgroup">
        <button id="playBtn" class="chip chip--play" aria-pressed="false"></button>
        <button id="resetBtn" class="chip"></button>
      </div>
      <div class="tgroup" id="focusBtns"></div>
      <button id="compareBtn" class="chip"></button>
    </div>
  </div>

  <section class="wrap map-section">
    <p class="map-caption" id="chartCaption"></p>
    <div class="map-layout">
      <div class="map-wrap">
        <svg id="mapSvg" viewBox="0 0 1520 880" role="group" aria-label="论证流导图：五个误解，各四步推演"></svg>
      </div>
      <aside class="detail" id="detail" aria-live="polite"></aside>
    </div>
  </section>

  <section class="wrap section" id="compare">
    <div class="section-head"><h2 id="compareTitle"></h2></div>
    <p class="section-note" id="compareNote"></p>
    <div class="cmp-table" id="cmpTable"></div>
  </section>

  <section class="wrap section" id="cards">
    <div class="section-head"><h2 id="cardsTitle"></h2></div>
    <div class="thread-cards" id="threadCards"></div>
  </section>

</main>

<footer class="footer"><div class="wrap" id="footerBox"></div></footer>

<script src="assets/data.js?v=1"></script>
<script src="assets/logic-data.js?v=2"></script>
<script src="assets/logic-app.js?v=2"></script>
</body>
</html>
